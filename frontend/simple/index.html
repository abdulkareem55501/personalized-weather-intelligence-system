<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Intelligence</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, Arial, sans-serif;
        background: #020818;
        color: #fff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 12% 12%, rgba(0,100,255,.26), transparent 30%),
          radial-gradient(circle at 88% 18%, rgba(0,200,150,.16), transparent 26%),
          radial-gradient(circle at 48% 92%, rgba(168,85,247,.13), transparent 30%),
          #020818;
      }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      h1, h2, h3, p { margin: 0; }
      .app { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 56px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .logo {
        width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px;
        background: linear-gradient(135deg, #0064ff, #00c896);
        box-shadow: 0 12px 34px rgba(0,100,255,.3);
        font-weight: 900;
      }
      .logo-mark {
        position: relative;
        overflow: hidden;
      }
      .logo-mark::before {
        content: "";
        position: absolute;
        width: 26px;
        height: 14px;
        left: 11px;
        top: 16px;
        border-radius: 999px;
        background: #fff;
        box-shadow: -6px 1px 0 -1px #fff, 7px -5px 0 1px #fff;
      }
      .logo-mark::after {
        content: "";
        position: absolute;
        left: 14px;
        top: 31px;
        width: 21px;
        height: 10px;
        border-left: 3px solid #fff;
        border-bottom: 3px solid #fff;
        transform: skewX(-24deg);
        opacity: .95;
      }
      .logo-pulse {
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #001a34;
        border: 2px solid #fff;
        box-shadow: 0 0 14px rgba(255,255,255,.7);
      }
      .muted { color: rgba(255,255,255,.58); }
      .small { font-size: 13px; }
      .card {
        border: 1px solid rgba(255,255,255,.11);
        background: rgba(4,16,32,.84);
        box-shadow: 0 20px 60px rgba(0,0,0,.34);
        border-radius: 18px;
        padding: 22px;
      }
      .hero {
        position: relative;
        min-height: calc(100vh - 130px);
        display: grid;
        place-items: center;
      }
      .hero::before {
        content: "";
        position: absolute;
        inset: 10% auto auto 50%;
        width: 340px;
        height: 340px;
        border-radius: 50%;
        background: rgba(0,200,150,.1);
        filter: blur(18px);
        animation: floatGlow 6s ease-in-out infinite;
        pointer-events: none;
        transform: translateX(-50%);
      }
      .hero h1 { font-size: clamp(42px, 6vw, 78px); line-height: .96; letter-spacing: 0; }
      .hero-title-line { display: block; }
      .gradient-word {
        display: inline-block;
        background: linear-gradient(135deg, #8bbcff 0%, #00c896 48%, #c99cff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .hero-copy {
        position: relative;
        width: min(980px, 100%);
        padding: clamp(28px, 5vw, 56px);
        overflow: hidden;
        text-align: center;
      }
      .hero-copy::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 0%, rgba(139,188,255,.16), transparent 38%),
          linear-gradient(135deg, rgba(255,255,255,.08), transparent 28%, rgba(0,100,255,.08));
        pointer-events: none;
      }
      .hero-content { position: relative; z-index: 2; }
      .eyebrow {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        border: 1px solid rgba(139,188,255,.28);
        background: rgba(0,100,255,.11);
        color: #8bbcff;
        border-radius: 999px;
        padding: 8px 11px;
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: .08em;
        margin-bottom: 18px;
      }
      .pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #00c896;
        animation: pulse 1.8s infinite;
      }
      .lead { color: rgba(255,255,255,.72); font-size: 18px; line-height: 1.75; margin: 20px auto 0; max-width: 760px; }
      .feature-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 28px; text-align: left; }
      .feature {
        position: relative;
        display: grid; gap: 10px;
        padding: 16px; border-radius: 14px; background: rgba(255,255,255,.04);
        border: 1px solid rgba(255,255,255,.08);
        animation: riseIn .7s ease both;
        transition: transform .2s ease, border-color .2s ease, background .2s ease;
      }
      .feature:nth-child(2) { animation-delay: .08s; }
      .feature:nth-child(3) { animation-delay: .16s; }
      .feature:hover { transform: translateY(-3px); border-color: rgba(139,188,255,.28); background: rgba(255,255,255,.07); }
      .dot { width: 10px; height: 10px; border-radius: 999px; background: #00c896; margin-top: 6px; box-shadow: 0 0 18px #00c896; }
      .feature-icon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: rgba(0,100,255,.14);
        border: 1px solid rgba(139,188,255,.18);
        font-size: 18px;
      }
      .project-facts {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 24px;
      }
      .fact-card {
        border: 1px solid rgba(255,255,255,.09);
        background: rgba(255,255,255,.045);
        border-radius: 14px;
        padding: 13px;
      }
      .fact-card span {
        display: block;
        color: rgba(255,255,255,.5);
        font-size: 12px;
        margin-bottom: 5px;
      }
      .fact-card strong {
        color: #fff;
        font-size: 14px;
      }
      .hero-side {
        position: relative;
        overflow: hidden;
        min-height: 520px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .hero-side::before {
        content: "";
        position: absolute;
        inset: -80px -80px auto auto;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: rgba(0,100,255,.22);
        filter: blur(28px);
        animation: floatGlow 5.5s ease-in-out infinite reverse;
      }
      .weather-orbit { position: relative; height: 230px; display: grid; place-items: center; z-index: 1; }
      .weather-core {
        width: 138px;
        height: 138px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, rgba(0,100,255,.95), rgba(0,200,150,.82));
        box-shadow: 0 22px 70px rgba(0,100,255,.34);
        animation: breathe 3.2s ease-in-out infinite;
      }
      .core-logo {
        position: relative;
        width: 82px;
        height: 82px;
        border-radius: 24px;
        background: rgba(255,255,255,.14);
        border: 1px solid rgba(255,255,255,.24);
        box-shadow: inset 0 0 24px rgba(255,255,255,.08);
      }
      .core-logo::before {
        content: "";
        position: absolute;
        left: 18px;
        top: 21px;
        width: 42px;
        height: 22px;
        border-radius: 999px;
        background: white;
        box-shadow: -9px 2px 0 -2px white, 11px -8px 0 1px white;
      }
      .core-logo::after {
        content: "";
        position: absolute;
        left: 20px;
        bottom: 17px;
        width: 42px;
        height: 16px;
        border-left: 4px solid white;
        border-bottom: 4px solid white;
        transform: skewX(-24deg);
      }
      .ai-nodes {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .ai-node {
        position: absolute;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #c99cff;
        box-shadow: 0 0 14px #a855f7;
        animation: nodePulse 2.2s ease-in-out infinite;
      }
      .ai-node.one { left: 22%; top: 24%; }
      .ai-node.two { right: 18%; top: 35%; animation-delay: .4s; background: #8bbcff; box-shadow: 0 0 14px #3385ff; }
      .ai-node.three { left: 34%; bottom: 14%; animation-delay: .8s; background: #00c896; box-shadow: 0 0 14px #00c896; }
      .ai-line {
        position: absolute;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
        transform-origin: left center;
        animation: shimmerLine 2.8s ease-in-out infinite;
      }
      .ai-line.one { width: 92px; left: 26%; top: 30%; transform: rotate(18deg); }
      .ai-line.two { width: 108px; left: 38%; top: 55%; transform: rotate(132deg); animation-delay: .6s; }
      .ai-line.three { width: 86px; left: 31%; top: 68%; transform: rotate(-22deg); animation-delay: 1s; }
      .health-strip {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 16px 0;
      }
      .health-card {
        border: 1px solid rgba(255,255,255,.09);
        background: rgba(255,255,255,.045);
        border-radius: 14px;
        padding: 13px;
      }
      .health-card strong { display: block; margin-top: 6px; }
      .orbit-ring {
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,.13);
        animation: rotate 14s linear infinite;
      }
      .orbit-ring::before, .orbit-ring::after {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #8bbcff;
        box-shadow: 0 0 18px #3385ff;
      }
      .orbit-ring::before { top: 16px; left: 32px; }
      .orbit-ring::after { right: 22px; bottom: 34px; background: #00c896; box-shadow: 0 0 18px #00c896; }
      .mini-stats { position: relative; z-index: 1; display: grid; gap: 10px; }
      .mini-stat {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 13px;
        border-radius: 13px;
        background: rgba(255,255,255,.055);
        border: 1px solid rgba(255,255,255,.08);
      }
      .steps { position: relative; z-index: 1; margin-top: 18px; display: grid; gap: 10px; }
      .step-row { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; color: rgba(255,255,255,.68); }
      .step-num {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: rgba(0,100,255,.16);
        color: #8bbcff;
        font-weight: 900;
        font-size: 12px;
      }
      .button {
        border: 0; border-radius: 13px; color: white;
        background: linear-gradient(135deg, #0064ff, #3385ff);
        padding: 13px 18px; font-weight: 800;
        box-shadow: 0 12px 30px rgba(0,100,255,.3);
      }
      .button.secondary {
        background: rgba(255,255,255,.06);
        border: 1px solid rgba(255,255,255,.13);
        box-shadow: none;
      }
      .button.evaluation-secondary {
        background: rgba(255,255,255,.035);
        border: 1px solid rgba(139,188,255,.18);
        color: rgba(255,255,255,.78);
        box-shadow: none;
      }
      .button.evaluation-secondary:hover {
        background: rgba(139,188,255,.08);
        color: #fff;
      }
      .button.success { background: linear-gradient(135deg, #00a87d, #00c896); box-shadow: 0 12px 30px rgba(0,200,150,.22); }
      .button:disabled { opacity: .55; cursor: not-allowed; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
      .flow-actions {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
        margin: 26px 0 6px;
      }
      .step-button {
        min-width: 260px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 1px solid rgba(139,188,255,.24);
        border-radius: 16px;
        padding: 15px 18px;
        color: white;
        font-weight: 900;
        background: linear-gradient(135deg, rgba(0,100,255,.96), rgba(51,133,255,.72));
        box-shadow: 0 16px 42px rgba(0,100,255,.28);
        transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
      }
      .step-button:hover {
        transform: translateY(-2px);
        border-color: rgba(139,188,255,.46);
        box-shadow: 0 20px 52px rgba(0,100,255,.36);
      }
      .step-button.forecast {
        background: linear-gradient(135deg, rgba(0,168,125,.96), rgba(0,200,150,.72));
        border-color: rgba(0,200,150,.28);
        box-shadow: 0 16px 42px rgba(0,200,150,.22);
      }
      .button-icon {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: rgba(255,255,255,.14);
      }
      .grid { display: grid; gap: 16px; }
      .two { grid-template-columns: 1fr 1fr; }
      .three { grid-template-columns: repeat(3, 1fr); }
      .four { grid-template-columns: repeat(4, 1fr); }
      .form-page { max-width: 980px; margin: 0 auto; }
      .page-title { margin-bottom: 20px; }
      .page-title h1 { font-size: clamp(30px, 4vw, 46px); }
      label { display: block; color: rgba(255,255,255,.68); font-size: 13px; margin-bottom: 7px; }
      input, select {
        width: 100%; border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
        background: rgba(255,255,255,.06); color: white; padding: 12px; outline: none;
      }
      select option { background: #041020; }
      input:focus, select:focus { border-color: #3385ff; box-shadow: 0 0 0 3px rgba(51,133,255,.15); }
      .checks { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip {
        border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05);
        color: rgba(255,255,255,.74); border-radius: 999px; padding: 8px 11px;
      }
      .chip.active { border-color: rgba(0,100,255,.8); background: rgba(0,100,255,.18); color: #8bbcff; }
      .loader-wrap { min-height: 58vh; display: grid; place-items: center; text-align: center; }
      .weather-loader {
        position: relative;
        width: 132px;
        height: 132px;
        margin: 0 auto 24px;
      }
      .loader-cloud {
        position: absolute;
        left: 21px;
        top: 46px;
        width: 90px;
        height: 40px;
        border-radius: 999px;
        background: linear-gradient(135deg, rgba(139,188,255,.95), rgba(0,100,255,.85));
        box-shadow: 0 18px 42px rgba(0,100,255,.32);
        animation: cloudFloat 2s ease-in-out infinite;
      }
      .loader-cloud::before,
      .loader-cloud::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: inherit;
      }
      .loader-cloud::before { width: 42px; height: 42px; left: 12px; top: -22px; }
      .loader-cloud::after { width: 52px; height: 52px; right: 10px; top: -28px; }
      .loader-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,.09);
        border-top-color: #00c896;
        animation: rotate 1.2s linear infinite;
      }
      .loader-rain {
        position: absolute;
        width: 3px;
        height: 18px;
        border-radius: 999px;
        background: #00c896;
        top: 92px;
        animation: rainDrop .8s ease-in-out infinite;
      }
      .loader-rain.one { left: 42px; }
      .loader-rain.two { left: 64px; animation-delay: .12s; }
      .loader-rain.three { left: 86px; animation-delay: .24s; }
      .spinner {
        width: 64px; height: 64px; border-radius: 50%;
        border: 4px solid rgba(255,255,255,.12);
        border-top-color: #3385ff;
        animation: spin .9s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(0,200,150,.55); }
        70% { box-shadow: 0 0 0 9px rgba(0,200,150,0); }
        100% { box-shadow: 0 0 0 0 rgba(0,200,150,0); }
      }
      @keyframes riseIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes floatGlow {
        0%, 100% { transform: translateY(0) scale(1); opacity: .8; }
        50% { transform: translateY(-18px) scale(1.06); opacity: 1; }
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.045); }
      }
      @keyframes rotate {
        to { transform: rotate(360deg); }
      }
      @keyframes nodePulse {
        0%, 100% { transform: scale(1); opacity: .85; }
        50% { transform: scale(1.45); opacity: 1; }
      }
      @keyframes shimmerLine {
        0%, 100% { opacity: .2; }
        50% { opacity: .85; }
      }
      @keyframes cloudFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
      @keyframes rainDrop {
        0% { opacity: 0; transform: translateY(-8px); }
        40% { opacity: 1; }
        100% { opacity: 0; transform: translateY(18px); }
      }
      .metric {
        position: relative;
        overflow: hidden;
        min-height: 145px;
        transition: transform .2s ease, border-color .2s ease;
      }
      .metric:hover { transform: translateY(-3px); border-color: rgba(139,188,255,.24); }
      .metric::after {
        content: "";
        position: absolute;
        right: -28px;
        bottom: -36px;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: rgba(51,133,255,.1);
      }
      .metric-icon {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.1);
        font-size: 22px;
        margin-bottom: 14px;
      }
      .metric span { display: block; color: rgba(255,255,255,.5); font-size: 13px; margin-bottom: 8px; }
      .metric strong { font-size: 34px; position: relative; z-index: 1; }
      .risk-hero-card {
        border-color: rgba(255,184,0,.22);
        background:
          radial-gradient(circle at 82% 28%, rgba(255,184,0,.14), transparent 32%),
          rgba(4,16,32,.84);
      }
      .risk-hero-card.low { border-color: rgba(0,200,150,.26); background: radial-gradient(circle at 82% 28%, rgba(0,200,150,.14), transparent 32%), rgba(4,16,32,.84); }
      .risk-hero-card.high { border-color: rgba(239,68,68,.32); background: radial-gradient(circle at 82% 28%, rgba(239,68,68,.16), transparent 32%), rgba(4,16,32,.84); }
      .risk-bar {
        height: 11px;
        border-radius: 999px;
        background: rgba(255,255,255,.08);
        overflow: hidden;
        margin-top: 12px;
      }
      .risk-bar div {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #00c896, #ffb800, #ef4444);
      }
      .status {
        display: inline-flex; align-items: center; border-radius: 999px;
        padding: 6px 10px; font-size: 13px; font-weight: 800;
      }
      .low, .ideal { background: rgba(0,200,150,.15); color: #00c896; }
      .medium, .suitable { background: rgba(255,184,0,.16); color: #ffb800; }
      .high, .avoid { background: rgba(239,68,68,.16); color: #ff7777; }
      .accent { background: rgba(168,85,247,.16); color: #c99cff; }
      .section-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 28px 0 14px; }
      .meter { height: 10px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
      .meter div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ef4444, #ffb800, #00c896); }
      .activity-card { display: grid; gap: 12px; }
      .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .explain { line-height: 1.7; margin-top: 10px; }
      .notice {
        border: 1px solid rgba(255,184,0,.22);
        background: rgba(255,184,0,.08);
        border-radius: 12px;
        padding: 13px;
      }
      .factor, .time-slot { border-top: 1px solid rgba(255,255,255,.08); padding-top: 12px; margin-top: 12px; }
      .risk-panel, .forecast-panel {
        position: relative;
        overflow: hidden;
      }
      .risk-panel::before, .forecast-panel::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 3px;
        background: linear-gradient(90deg, #0064ff, #00c896, #a855f7);
      }
      .panel-kicker {
        color: #8bbcff;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .08em;
        margin-bottom: 8px;
      }
      .risk-summary {
        display: grid;
        grid-template-columns: 1.1fr .9fr;
        gap: 16px;
        margin-top: 18px;
      }
      .insight-card {
        border: 1px solid rgba(255,255,255,.09);
        background: rgba(255,255,255,.045);
        border-radius: 14px;
        padding: 16px;
      }
      .factor-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 16px;
      }
      .factor-card {
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 14px;
        background: rgba(255,255,255,.045);
        padding: 14px;
      }
      .factor-card.high { border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.08); }
      .factor-card.medium { border-color: rgba(255,184,0,.32); background: rgba(255,184,0,.08); }
      .factor-card.low { border-color: rgba(0,200,150,.28); background: rgba(0,200,150,.07); }
      .forecast-grid {
        display: grid;

      .evidence-card::after {

      .evidence-card span { color: rgba(255,255,255,.5); font-size: 12px; }
      .evidence-card strong { display: block; font-size: 25px; margin-top: 7px; position: relative; z-index: 1; }
      .eval-summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);

      }
      .eval-card {
        position: relative;

      .scoreline {

      .eval-ring {

        background:
          radial-gradient(circle at center, #041020 58%, transparent 59%),

      .best-chip {
        display: inline-flex;

        color: #00c896;
        background: rgba(0,200,150,.12);

      }

      }
      .method-card span { display: block; color: rgba(255,255,255,.48); font-size: 12px; margin-bottom: 5px; }
      .method-card strong { font-size: 15px; }
      .reference-list {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }
      .reference-card {
        border: 1px solid rgba(139,188,255,.14);

      .error { border-color: rgba(239,68,68,.35); color: #ff9292; }
      @media (max-width: 920px) {
        .hero, .two, .three, .four, .risk-summary, .factor-grid, .forecast-grid, .feature-list, .project-facts, .eval-summary, .eval-layout, .method-grid, .evidence-strip { grid-template-columns: 1fr; }
        .hero { min-height: auto; }
        .topbar, .section-head { align-items: flex-start; flex-direction: column; }
        .hero-copy { text-align: left; }

      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = React;
      const HEALTH = ["None", "Asthma", "Heart condition", "Diabetes", "Arthritis", "Respiratory illness"];
      const ACTIVITIES = ["Walking", "Running", "Cycling", "Swimming", "Gardening"];
      const SENS = ["Low", "Medium", "High"];
      const defaultProfile = {
        name: "",
        age: "",
        gender: "Prefer not to say",
        health_conditions: ["None"],
        activity_preferences: ["Walking"],
        heat_sensitivity: "Medium",
        cold_sensitivity: "Medium"
      };

      function MultiSelect({ options, value, onChange }) {
        function toggle(item) {
          if (item === "None") {
            onChange(["None"]);
            return;
          }
          const clean = value.filter((v) => v !== "None");
          const next = clean.includes(item) ? clean.filter((v) => v !== item) : [...clean, item];
          onChange(next.length ? next : ["None"]);
        }
        return (
          <div className="checks">
            {options.map((item) => (
              <button key={item} type="button" className={`chip ${value.includes(item) ? "active" : ""}`} onClick={() => toggle(item)}>
                {item}
              </button>
            ))}
          </div>
        );
      }

      function Loader({ title, subtitle }) {
        return (
          <div className="loader-wrap">
            <div>
              <div className="weather-loader">
                <div className="loader-ring"></div>
                <div className="loader-cloud"></div>
                <div className="loader-rain one"></div>
                <div className="loader-rain two"></div>
                <div className="loader-rain three"></div>
              </div>
              <h2>{title}</h2>
              <p className="muted explain">{subtitle}</p>
            </div>
          </div>
        );
      }

      function formatMetric(value, decimals = 3) {
        if (value === undefined || value === null || Number.isNaN(Number(value))) return "N/A";
        return Number(value).toFixed(decimals);
      }

      function pct(value) {
        if (value === undefined || value === null || Number.isNaN(Number(value))) return "N/A";
        return `${(Number(value) * 100).toFixed(1)}%`;
      }

      function ComparisonBars({ title, subtitle, data, metric, lowerIsBetter = false, tone = "" }) {
        const entries = Object.entries(data || {});
        const values = entries.map(([, item]) => Number(item[metric]));
        const max = Math.max(...values, 1);
        const min = Math.min(...values);
        return (
          <div className="chart-card">
            <div className="chart-head">
              <div>
                <h3>{title}</h3>
                <p className="muted small explain">{subtitle}</p>
              </div>
              <span className="best-chip">{lowerIsBetter ? "Lower is better" : "Higher is better"}</span>
            </div>
            <div className="bar-list">
              {entries.map(([name, item]) => {
                const value = Number(item[metric]);
                const isBest = lowerIsBetter ? value === min : value === max;
                const width = lowerIsBetter ? Math.max(8, 100 - ((value - min) / Math.max(max - min, .001)) * 72) : Math.max(8, (value / max) * 100);
                return (
                  <div className={`bar-row ${isBest ? "winner-row" : ""}`} key={`${title}-${name}`}>
                    <span>{name}{isBest ? " *" : ""}</span>
                    <div className="bar-track"><div className={`bar-fill ${tone}`} style={{ width: `${width}%` }}></div></div>
                    <span className="bar-value">{formatMetric(value)}</span>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      function FeatureImportance({ metrics }) {
        const importance = metrics?.feature_importance || {};
        const names = metrics?.feature_names || {};
        const entries = Object.entries(importance).sort((a, b) => b[1] - a[1]);
        const max = Math.max(...entries.map(([, value]) => Number(value)), 1);
        return (
          <div className="chart-card">
            <div className="chart-head">
              <div>
                <h3>Feature Importance</h3>
                <p className="muted small explain">Model signal strength for the deployed feels-like prediction model.</p>
              </div>
              <span className="best-chip">Random Forest</span>
            </div>
            <div className="bar-list">
              {entries.map(([key, value]) => (
                <div className="bar-row" key={key}>
                  <span>{names[key] || key}</span>
                  <div className="bar-track"><div className="bar-fill purple" style={{ width: `${Math.max(5, (value / max) * 100)}%` }}></div></div>
                  <span className="bar-value">{formatMetric(value, 4)}</span>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function ModelScoreCard({ label, model, primary, secondary, score, ringClass, note, featured = false }) {
        return (
          <div className={`eval-card ${featured ? "featured" : ""}`}>
            <span className="muted small">{label}</span>
            <strong>{model}</strong>
            <div className="scoreline">
              <div className={`eval-ring ${ringClass}`} style={{ "--score": score }}>{primary}</div>
              <div>
                <p className="muted small">{secondary}</p>
                <p className="muted small" style={{ lineHeight: 1.6, marginTop: 6 }}>{note}</p>
              </div>
            </div>
          </div>
        );
      }

      function ModelEvaluation({ metrics, onBack, onStart }) {
        const healthClasses = ["Low", "Medium", "High"];
        const bestHealthAccuracy = Math.max(...Object.values(metrics.health_risk.comparison || {}).map((item) => Number(item.Accuracy || 0)));
        const deployedHealthAccuracy = Number(metrics.health_risk.Accuracy || 0);
        const healthGap = Math.max(0, bestHealthAccuracy - deployedHealthAccuracy);
        return (
          <section className="evaluation-page">
            <div className="section-head">
              <div>
                <h1>ML model evaluation</h1>
                <p className="muted explain">Transparent validation results for the trained models behind the application.</p>
              </div>
              <div className="actions" style={{ marginTop: 0 }}>
                <button className="button secondary" onClick={onBack}>Back to Home</button>
                <button className="button success" onClick={onStart}>Run Weather Analysis</button>
              </div>
            </div>

            <div className="card eval-hero">
              <div className="eval-title">
                <div className="panel-kicker">Training and validation results</div>
                <h1>Model evidence dashboard</h1>
                <p className="muted explain">
                  This page shows the latest saved training results from <strong>models/metrics.json</strong>: deployed
                  algorithms, headline accuracy/error scores, model comparisons, feature importance, and class-level
                  health-risk reliability.
                </p>
              </div>
              <div className="evidence-strip">
                <div className="evidence-card"><span>Models compared</span><strong>20</strong><p className="muted small">Regression and classification algorithms tested.</p></div>
                <div className="evidence-card"><span>Weather features</span><strong>8</strong><p className="muted small">Temperature, humidity, wind, AQI, age, health score, sensitivities.</p></div>
                <div className="evidence-card"><span>Training source</span><strong>ASHRAE</strong><p className="muted small">Thermal comfort database used for model training.</p></div>
                <div className="evidence-card"><span>Runtime source</span><strong>OpenWeatherMap</strong><p className="muted small">Live weather, AQI, UV, and forecast inputs.</p></div>
              </div>
              <div className="eval-summary">
                <ModelScoreCard
                  label="Feels-like temperature"
                  model={metrics.feels_like.algorithm}
                  primary={`${formatMetric(metrics.feels_like.MAE)}`}
                  secondary={`MAE | RMSE ${formatMetric(metrics.feels_like.RMSE)}`}
                  score={Math.max(8, 100 - Number(metrics.feels_like.MAE || 0) * 100)}
                  ringClass="error-ring"
                  note="Lower error means the personalised perceived-temperature estimate is closer to the test target."
                />
                <ModelScoreCard
                  label="Activity suitability"
                  model={metrics.activity.best_algorithm}
                  primary={pct(metrics.activity.F1)}
                  secondary={`Accuracy ${pct(metrics.activity.Accuracy)} | Recall ${pct(metrics.activity.Recall)}`}
                  score={Number(metrics.activity.F1 || 0) * 100}
                  ringClass="green-ring"
                  note="Weighted F1 is used because suitability decisions need balanced precision and recall."
                  featured={true}
                />
                <ModelScoreCard
                  label="Health risk"
                  model={metrics.health_risk.best_algorithm}
                  primary={pct(metrics.health_risk.F1)}
                  secondary={`Accuracy ${pct(metrics.health_risk.Accuracy)} | Gap from raw best ${(healthGap * 100).toFixed(1)}%`}
                  score={Number(metrics.health_risk.F1 || 0) * 100}
                  ringClass="purple-ring"
                  note="Selected for non-linear health-risk modelling while remaining within 1% of the highest raw score."
                />
              </div>
            </div>

            <div className="eval-layout">
              <ComparisonBars
                title="Feels-like model comparison"
                subtitle="Mean absolute error in degrees Celsius across tested regression models."
                data={metrics.feels_like.comparison}
                metric="MAE"
                lowerIsBetter={true}
              />
              <ComparisonBars
                title="Activity model comparison"
                subtitle="F1 score across suitability classifiers for outdoor activity recommendations."
                data={metrics.activity.comparison}
                metric="F1"
                tone="warning"
              />
            </div>

            <div className="eval-layout">
              <ComparisonBars
                title="Health-risk model comparison"
                subtitle="F1 score across tested health-risk classifiers."
                data={metrics.health_risk.comparison}
                metric="F1"
                tone="purple"
              />
              <FeatureImportance metrics={metrics} />
            </div>

            <div className="eval-layout">
              <div className="chart-card">
                <div className="chart-head">
                  <div>
                    <h3>Health-risk class performance</h3>
                    <p className="muted small explain">Precision and recall for Low, Medium, and High risk labels.</p>
                  </div>
                  <span className="best-chip">Per class</span>
                </div>
                <table className="eval-table">
                  <thead>
                    <tr><th>Risk class</th><th>Precision</th><th>Recall</th></tr>
                  </thead>
                  <tbody>
                    {healthClasses.map((label) => (
                      <tr key={label}>
                        <td><strong>{label}</strong></td>
                        <td>{pct(metrics.health_risk.precision_per_class?.[label])}</td>
                        <td>{pct(metrics.health_risk.recall_per_class?.[label])}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div className="chart-card">
                <div className="chart-head">
                  <div>
                    <h3>Why Neural Network for health risk?</h3>
                    <p className="muted small explain">The raw comparison table is transparent, but deployment also considers the nature of the task.</p>
                  </div>
                </div>
                <div className="method-grid">
                  <div className="method-card"><span>Deployed health model</span><strong>{metrics.health_risk.best_algorithm}</strong></div>
                  <div className="method-card"><span>Raw best accuracy</span><strong>{pct(bestHealthAccuracy)}</strong></div>
                  <div className="method-card"><span>Deployment accuracy</span><strong>{pct(deployedHealthAccuracy)}</strong></div>
                  <div className="method-card"><span>Difference</span><strong>{(healthGap * 100).toFixed(1)}%</strong></div>
                </div>
                <p className="muted explain">
                  The Neural Network was selected because health risk is not only a leaderboard problem. Weather-health
                  response is non-linear: temperature, humidity, AQI, UV, age, and health conditions interact together.
                  The MLP result is within 1% of the highest raw accuracy, so the project prioritises a model family that
                  is appropriate for complex interaction patterns while still showing strong validation performance.
                </p>
                <div className="reference-list">
                  <div className="reference-card">
                    <a href="https://www.frontiersin.org/journals/built-environment/articles/10.3389/fbuil.2020.00049/full" target="_blank">
                      Ghahramani et al. (2020), Frontiers in Built Environment
                    </a>
                    <p className="muted small" style={{ lineHeight: 1.6, marginTop: 6 }}>
                      Reviews AI methods for thermal comfort systems and discusses occupant/context-aware modelling.
                    </p>
                  </div>
                  <div className="reference-card">
                    <a href="https://www.nature.com/articles/s41467-023-37626-2" target="_blank">
                      Precision Environmental Health, Nature Communications (2023)
                    </a>
                    <p className="muted small" style={{ lineHeight: 1.6, marginTop: 6 }}>
                      Supports individualised environmental-health risk prediction using personal and environmental data.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </section>
        );
      }

      function App() {
        const [step, setStep] = useState("intro");
        const [city, setCity] = useState("London");
        const [profile, setProfile] = useState(defaultProfile);
        const [result, setResult] = useState(null);
        const [metrics, setMetrics] = useState(null);
        const [showRisk, setShowRisk] = useState(false);
        const [riskLoading, setRiskLoading] = useState(false);
        const [forecastButtonVisible, setForecastButtonVisible] = useState(false);
        const [forecastVisible, setForecastVisible] = useState(false);
        const [forecastLoading, setForecastLoading] = useState(false);
        const [error, setError] = useState("");

        function setField(field, value) {
          setProfile((current) => ({ ...current, [field]: value }));
        }

        function startNewPrediction() {
          setProfile(defaultProfile);
          setResult(null);
          setShowRisk(false);
          setRiskLoading(false);
          setForecastButtonVisible(false);
          setForecastVisible(false);
          setForecastLoading(false);
          setError("");
          setStep("form");
        }

        async function openEvaluation() {
          setError("");
          setStep("modelLoading");
          try {
            const response = await fetch("/api/metrics");
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || "Could not load model metrics");
            setMetrics(data);
            setTimeout(() => setStep("modelEvaluation"), 450);
          } catch (err) {
            setError(err.message);
            setStep("intro");
          }
        }

        async function getPrediction(event) {
          event.preventDefault();
          setError("");
          setShowRisk(false);
          setRiskLoading(false);
          setForecastButtonVisible(false);
          setForecastVisible(false);
          setForecastLoading(false);
          setStep("predictionLoading");
          try {
            const cleanProfile = {
              ...profile,
              name: profile.name.trim() || "Guest",
              age: Number(profile.age) || 25
            };
            const response = await fetch("/api/predict", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ city, profile: cleanProfile })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || "Prediction failed");
            setProfile(cleanProfile);
            setResult(data);
            setStep("prediction");
          } catch (err) {
            setError(err.message);
            setStep("form");
          }
        }

        function revealForecast() {
          setForecastVisible(false);
          setForecastLoading(true);
          setStep("forecastLoading");
          setTimeout(() => {
            setForecastLoading(false);
            setForecastVisible(true);
            setStep("forecast");
          }, 650);
        }

        function revealRisk() {
          setShowRisk(false);
          setForecastButtonVisible(false);
          setForecastVisible(false);
          setRiskLoading(true);
          setStep("riskLoading");
          setTimeout(() => {
            setRiskLoading(false);
            setShowRisk(true);
            setForecastButtonVisible(true);
            setStep("risk");
          }, 650);
        }

        const activities = result ? Object.entries(result.activities || {}) : [];
        const riskWidth = result?.risk_level === "High" ? 95 : result?.risk_level === "Medium" ? 62 : 28;
        const riskMeaning = result?.risk_level === "High"
          ? "High risk means current conditions may strongly affect your health profile. Reduce outdoor exposure and avoid intense activity."
          : result?.risk_level === "Medium"
            ? "Medium risk means current conditions need caution. Use precautions, reduce intensity, and monitor symptoms."
            : "Low risk means current conditions are generally acceptable for your profile, while normal safety precautions still apply.";

        return (
          <main className="app">
            <header className="topbar">
              <div className="brand">
                <div className="logo logo-mark"><span className="logo-pulse"></span></div>
                <div>
                  <strong>Personalized Weather Intelligence</strong>
                  <p className="muted small">Weather-aware health and activity intelligence</p>
                </div>
              </div>
            </header>

            {step === "intro" && (
              <section className="hero">
                <div className="card hero-copy">
                  <div className="hero-content">
                    <div className="eyebrow"><span className="pulse-dot"></span> Final Year AI Weather System</div>
                    <h1>
                      <span className="hero-title-line">Personalized</span>
                      <span className="hero-title-line gradient-word">Weather Intelligence</span>
                    </h1>
                    <p className="lead">
                      A machine-learning system that combines live weather, trained thermal-comfort models,
                      and individual health profiles to produce four practical outputs: personalised perceived
                      temperature, health risk, activity suitability, and safer forecast timing.
                    </p>
                    <div className="feature-list">
                      <div className="feature"><div className="feature-icon">🌡️</div><div><strong>Personalized feels-like</strong><p className="muted small">Main factors: temperature, humidity, wind, age, health score, and heat/cold sensitivity.</p></div></div>
                      <div className="feature"><div className="feature-icon">🩺</div><div><strong>Health risk</strong><p className="muted small">Main factors: heat/cold thresholds, AQI, humidity, UV level, age, and medical conditions.</p></div></div>
                      <div className="feature"><div className="feature-icon">🏃</div><div><strong>Activity suitability</strong><p className="muted small">Main factors: activity type, weather intensity, respiratory/cardiac risks, and safety precautions.</p></div></div>
                      <div className="feature"><div className="feature-icon">🕒</div><div><strong>Forecast timing</strong><p className="muted small">Main factors: 3-hour forecast temperature, humidity, wind, rain chance, and profile risk.</p></div></div>
                    </div>
                  </div>
                  <div className="actions hero-content">
                    <button className="button" onClick={() => setStep("form")}>Start Health Weather Check</button>
                    <button className="button evaluation-secondary" onClick={openEvaluation}>View ML Evaluation</button>
                  </div>
                </div>
              </section>
            )}

            {step === "form" && (
              <section className="form-page">
                <div className="page-title">
                  <h1>Tell us about your weather needs</h1>
                  <p className="muted explain">Your profile is used to personalise feels-like temperature, risk level, and activity suitability.</p>
                </div>
                {error && <div className="card error" style={{ marginBottom: 16 }}>{error}</div>}
                <form className="card grid" onSubmit={getPrediction}>
                  <div>
                    <label>City</label>
                    <input value={city} onChange={(e) => setCity(e.target.value)} placeholder="London" required />
                  </div>
                  <div className="grid two">
                    <div>
                      <label>Name</label>
                      <input value={profile.name} onChange={(e) => setField("name", e.target.value)} placeholder="Enter your name" />
                    </div>
                    <div>
                      <label>Age</label>
                      <input type="number" min="1" max="120" value={profile.age} onChange={(e) => setField("age", e.target.value)} placeholder="Enter your age" />
                    </div>
                  </div>
                  <div className="grid two">
                    <div>
                      <label>Heat sensitivity</label>
                      <select value={profile.heat_sensitivity} onChange={(e) => setField("heat_sensitivity", e.target.value)}>
                        {SENS.map((item) => <option key={item}>{item}</option>)}
                      </select>
                    </div>
                    <div>
                      <label>Cold sensitivity</label>
                      <select value={profile.cold_sensitivity} onChange={(e) => setField("cold_sensitivity", e.target.value)}>
                        {SENS.map((item) => <option key={item}>{item}</option>)}
                      </select>
                    </div>
                  </div>
                  <div>
                    <label>Health conditions</label>
                    <MultiSelect options={HEALTH} value={profile.health_conditions} onChange={(value) => setField("health_conditions", value)} />
                  </div>
                  <div>
                    <label>Activity preferences</label>
                    <MultiSelect options={ACTIVITIES} value={profile.activity_preferences} onChange={(value) => setField("activity_preferences", value)} />
                  </div>
                  <div className="actions">
                    <button type="button" className="button secondary" onClick={() => setStep("intro")}>Back</button>
                    <button className="button success">Generate Personal Weather Insight</button>
                  </div>
                </form>
              </section>
            )}

            {step === "predictionLoading" && (
              <Loader title="Generating your prediction" subtitle="Fetching live weather, applying your profile, and running the ML recommendation engine." />
            )}

            {step === "modelLoading" && (
              <Loader title="Loading model evaluation" subtitle="Reading saved model metrics, comparison results, feature importance, and validation tables." />
            )}

            {step === "modelEvaluation" && metrics && (
              <ModelEvaluation metrics={metrics} onBack={() => setStep("intro")} onStart={startNewPrediction} />
            )}

            {step === "prediction" && result && (
              <section>
                <div className="section-head">
                  <div>
                    <h1>{result.weather.city}, {result.weather.country}</h1>
                  <p className="muted explain">{result.weather.description}. Prediction personalised for {profile.name || "Guest"}.</p>
                  </div>
                  <button className="button secondary" onClick={startNewPrediction}>New Prediction</button>
                </div>

                <div className="grid four">
                  <div className="card metric"><div className="metric-icon">🌡️</div><span>Temperature</span><strong>{result.weather.temperature}&deg;C</strong><p className="muted small explain">{result.weather.description}</p></div>
                  <div className="card metric"><div className="metric-icon">🫁</div><span>Air Quality</span><strong>{result.weather.aqi_label}</strong><p className="muted small explain">AQI level {result.weather.aqi}</p></div>
                  <div className="card metric"><div className="metric-icon">💧</div><span>Humidity</span><strong>{result.weather.humidity}%</strong><p className="muted small explain">Moisture level affecting comfort.</p></div>
                  <div className="card metric"><div className="metric-icon">☀️</div><span>UV Level</span><strong>{result.weather.uv_label}</strong><p className="muted small explain">UV index {result.weather.uv_index}</p></div>
                </div>

                <div className="grid two" style={{ marginTop: 16 }}>
                  <div className="card metric"><div className="metric-icon">🤖</div><span>Personal feels like</span><strong>{result.feels_like}&deg;C</strong><p className="muted small explain">Adjusted using profile sensitivity and ML prediction.</p></div>
                  <div className={`card metric risk-hero-card ${result.risk_level.toLowerCase()}`}>
                    <div className="between">
                      <div>
                        <div className="metric-icon">🩺</div>
                        <span>Health risk level</span>
                        <strong><span className={`status ${result.risk_level.toLowerCase()}`}>{result.risk_level}</span></strong>
                      </div>
                      <span className="status accent">{result.confidence}% confidence</span>
                    </div>
                    <div className="risk-bar"><div style={{ width: `${riskWidth}%` }}></div></div>
                    <p className="muted small explain">{riskMeaning}</p>
                  </div>
                </div>

                <div className="grid three" style={{ marginTop: 16 }}>
                  {activities.map(([name, item]) => (
                    <div className="card activity-card" key={name}>
                      <div className="between">
                        <h3>{name}</h3>
                        <span className={`status ${item.status === "Not Recommended" ? "avoid" : item.status.toLowerCase()}`}>
                          {item.percentage}%
                        </span>
                      </div>
                      <div className="meter"><div style={{ width: `${item.percentage}%` }}></div></div>
                      <p className="muted explain">{item.recommendation}</p>
                      <p className="muted small" style={{ lineHeight: 1.6 }}>{item.explanation}</p>
                      <div className="notice">
                        <strong className="small">Safety precautions</strong>
                        <p className="muted small" style={{ lineHeight: 1.6, marginTop: 6 }}>{item.safety_precautions}</p>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="flow-actions">
                  {!showRisk && !riskLoading && (
                    <button className="step-button" onClick={revealRisk}>
                      <span className="button-icon">1</span>
                      Review Health Risk Factors
                    </button>
                  )}
                </div>

              </section>
            )}

            {step === "riskLoading" && (
              <Loader title="Preparing health risk analysis" subtitle="Checking weather triggers, health conditions, severity level, and confidence details." />
            )}

            {step === "risk" && result && (
              <section>
                <div className="section-head">
                  <div>
                    <h1>Health risk analysis</h1>
                    <p className="muted explain">A critical breakdown of which weather factors may affect your health profile in {result.weather.city}, {result.weather.country}.</p>
                  </div>
                  <button className="button secondary" onClick={() => setStep("prediction")}>Back to Prediction</button>
                </div>
                {showRisk && (
                  <div className="card risk-panel">
                    <div className="between">
                      <div>
                        <div className="panel-kicker">Personal health analysis</div>
                        <h2>Critical risk factors</h2>
                      </div>
                      <span className={`status ${result.risk_level.toLowerCase()}`}>{result.risk_level} · {result.confidence}% confidence</span>
                    </div>
                    <div className="risk-summary">
                      <div className="insight-card">
                        <h3>Summary</h3>
                        <p className="muted explain">{result.risk_explanation}</p>
                      </div>
                      <div className="insight-card">
                        <h3>Current weather triggers</h3>
                        <div className="slot-meta">
                          <div className="meta-pill"><span>Temperature</span><strong>{result.weather.temperature}&deg;C</strong></div>
                          <div className="meta-pill"><span>Humidity</span><strong>{result.weather.humidity}%</strong></div>
                          <div className="meta-pill"><span>Air quality</span><strong>{result.weather.aqi_label}</strong></div>
                          <div className="meta-pill"><span>UV level</span><strong>{result.weather.uv_label}</strong></div>
                        </div>
                      </div>
                    </div>
                    {(result.risk_factors || []).length > 0 && (
                      <div style={{ marginTop: 14 }}>
                        <h3>Risk factor cards</h3>
                        <div className="factor-grid">
                          {result.risk_factors.map((factor, index) => (
                            <div className={`factor-card ${factor.severity.toLowerCase()}`} key={`${factor.factor}-${index}`}>
                              <div className="between">
                                <strong>{factor.factor}</strong>
                                <span className={`status ${factor.severity.toLowerCase()}`}>{factor.severity}</span>
                              </div>
                              <p className="muted explain">{factor.detail}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}
                {forecastButtonVisible && (
                  <div className="flow-actions">
                    <button className="step-button forecast" onClick={revealForecast}>
                      <span className="button-icon">2</span>
                      Find Safest Activity Windows
                    </button>
                  </div>
                )}
              </section>
            )}

            {step === "forecastLoading" && (
              <Loader title="Finding safer activity windows" subtitle="Comparing forecast timing, rain chance, wind, humidity, activity type, and health conditions." />
            )}

            {step === "forecast" && result && forecastVisible && (
              <section>
                <div className="section-head">
                  <div>
                    <h1>Safest activity windows</h1>
                    <p className="muted explain">Forecast-based time windows ranked using weather conditions, selected activity purpose, and health profile.</p>
                  </div>
                  <button className="button secondary" onClick={() => setStep("risk")}>Back to Risk Explanation</button>
                </div>
                <div className="card forecast-panel">
                    <div className="between">
                      <div>
                        <div className="panel-kicker">Forecast planning</div>
                        <h2>Best forecast times for your activities</h2>
                        <p className="muted explain">OpenWeatherMap forecast windows ranked against your selected activities and health profile.</p>
                      </div>
                      <span className="status accent">Next 24 forecast hours</span>
                    </div>
                    {result.forecast_error && <p className="error explain">{result.forecast_error}</p>}
                    <div className="forecast-grid">
                      {Object.entries(result.activity_times || {}).map(([activity, slots]) => (
                        <div className="forecast-activity-card" key={activity}>
                          <div className="between">
                            <h3>{activity}</h3>
                            {slots[0] && <span className="status ideal">{slots[0].percentage}% best</span>}
                          </div>
                          {slots.length === 0 ? (
                            <p className="muted explain">No suitable forecast time found.</p>
                          ) : slots.map((slot, index) => (
                            <div className="forecast-slot" key={`${activity}-${slot.datetime}-${index}`}>
                              <div className="slot-top">
                                <div>
                                  <strong>{slot.datetime}</strong>
                                  <p className="muted small" style={{ marginTop: 4 }}>{slot.condition}</p>
                                </div>
                                <div className="score-ring" style={{ "--score": slot.percentage }}>{slot.percentage}%</div>
                              </div>
                              <div className="slot-meta">
                                <div className="meta-pill"><span>Temp</span><strong>{slot.temperature}&deg;C</strong></div>
                                <div className="meta-pill"><span>Humidity</span><strong>{slot.humidity}%</strong></div>
                                <div className="meta-pill"><span>Wind</span><strong>{slot.wind_speed} m/s</strong></div>
                                <div className="meta-pill"><span>Rain</span><strong>{slot.rain_probability}%</strong></div>
                              </div>
                              <div className="notice" style={{ marginTop: 12 }}>
                                <strong className="small">Activity check</strong>
                                <p className="muted small" style={{ lineHeight: 1.6, marginTop: 6 }}>{slot.activity_note}</p>
                              </div>
                              <p className="muted small" style={{ lineHeight: 1.6, marginTop: 10 }}>
                                <strong>Health and safety:</strong> {slot.health_note}
                              </p>
                            </div>
                          ))}
                        </div>
                      ))}
                    </div>
                  </div>
              </section>
            )}
          </main>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
